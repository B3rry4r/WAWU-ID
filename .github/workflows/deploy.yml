name: Deploy WAWU ID

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One at a time. Two overlapping rsyncs into the same directory, each
  # followed by a migration, is how a half-written release gets restarted.
  group: deploy-wawu-id
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wawu_id_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wawu_id_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma migrate deploy
      - run: npx tsc --noEmit
      - run: npm run build

  deploy:
    name: Deploy to droplet
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Load SSH key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned, not StrictHostKeyChecking=no — otherwise CI would accept
          # any host answering on that IP, which defeats the check.
          printf '%s\n' "${{ secrets.DROPLET_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Rsync to droplet
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude 'dist' \
            --exclude 'generated' --exclude '.env' --exclude 'keys' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            ./ wawu@${{ secrets.DROPLET_HOST }}:/srv/wawu/wawu-id/

      - name: Install, migrate, build, restart
        run: |
          ssh -i ~/.ssh/id_ed25519 wawu@${{ secrets.DROPLET_HOST }} \
            'bash /srv/wawu/wawu-id/deploy/deploy.sh wawu-id'

      - name: Prove it is actually serving
        # JWKS is the right probe: it 200s only if the RS256 keys loaded and
        # the app booted. A deploy that goes green on `systemctl restart`
        # returning is not evidence of anything.
        run: |
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              https://${{ secrets.ID_DOMAIN }}/.well-known/jwks.json || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 4
          done
          echo "WAWU ID did not serve JWKS after the deploy." >&2
          exit 1

  # ---------------------------------------------------------------------------
  # THE SAME GUARD AS THE HUB API, FOR THE SAME REASON.
  #
  # Over on WAWU-Backend seven deploys failed in a row between 14 and 21
  # September and nobody noticed, because the only signal was a red badge on a
  # page nobody opens. The droplet served week-old code for a week and it
  # surfaced as a validation error on an unrelated form.
  #
  # This service has MORE to lose from that than the Hub does. WAWU ID issues
  # the tokens and holds the names and the verification ticks, so a WAWU ID
  # release stuck behind main is a Hub that is authenticating against
  # yesterday's rules while every one of its own deploys goes green.
  #
  # So: a failure OPENS AN ISSUE AND ASSIGNS IT, which is the one GitHub event
  # that reliably reaches an inbox and a phone. One issue, found by a fixed
  # marker and updated in place rather than a new one per failure, because
  # seven issues are as easy to scroll past as seven badges were. It closes
  # itself on the next green deploy, so an open copy means "production is
  # behind main RIGHT NOW" rather than "something went wrong once".
  #
  # NO NEW SECRETS. GITHUB_TOKEN is issued to the run automatically.
  # ---------------------------------------------------------------------------
  notify:
    name: Report deploy status
    # The first job here is `build`, not `test` as in the Hub API. Same shape,
    # different name, and getting that wrong would silently never fire.
    needs: [build, deploy]
    # `always()`, not `failure()`: this has to run on a GREEN deploy too or the
    # issue it opened would never close. The branching is in the step
    # conditions below.
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Open or update the deploy-failure issue
        # `deploy` is SKIPPED when `build` fails, and a skipped job is not a
        # failed one, so both results are read explicitly. A cancelled run
        # raises nothing.
        if: needs.build.result == 'failure' || needs.deploy.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- deploy-failure-tracker -->';
            const failed = [
              ['Build', '${{ needs.build.result }}'],
              ['Deploy to droplet', '${{ needs.deploy.result }}'],
            ].filter(([, r]) => r === 'failure').map(([n]) => n).join(' and ');

            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha.slice(0, 8);
            const line = `**${failed}** failed for \`${sha}\`. [Run log](${run})`;

            // listForRepo, not the search API: search is eventually consistent,
            // so two failures minutes apart could both miss an existing issue
            // and open a duplicate.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = open.find((i) => (i.body || '').includes(MARKER));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing. ${line}`,
              });
              core.setFailed(`Deploy still failing — see issue #${existing.number}`);
              return;
            }

            const body = [
              MARKER,
              '',
              '## WAWU ID in production is behind `main`',
              '',
              line,
              '',
              'Until this is fixed the droplet keeps serving the last commit that',
              'deployed successfully, so anything merged after it is NOT live, however',
              'green its own pull request was.',
              '',
              'This service issues the tokens and holds the names and the verification',
              'ticks, so a release stuck here is the Hub API authenticating against',
              "yesterday's rules while its own deploys go green.",
              '',
              'This issue updates itself while the failure persists and closes itself',
              'on the next green deploy. An open copy means production is behind right',
              'now.',
            ].join('\n');

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 WAWU ID deploy to production is failing',
              body,
              // Assignment is what actually generates the notification. An
              // unassigned issue in a repo you own is another row nobody reads.
              assignees: [context.repo.owner],
            });
            core.setFailed(`Deploy failing — opened issue #${created.data.number}`);

      - name: Close the failure issue on a green deploy
        if: needs.build.result == 'success' && needs.deploy.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- deploy-failure-tracker -->';
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = open.find((i) => (i.body || '').includes(MARKER));
            if (!existing) return;

            const sha = context.sha.slice(0, 8);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: `Deploy is green again on \`${sha}\`. Production is up to date with \`main\`.`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              state: 'closed',
              state_reason: 'completed',
            });
